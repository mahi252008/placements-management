{% extends 'base.html' %}
{% block content %}
<h2>Welcome {{ current_user.username }}</h2>
<form method="POST" action="{{ url_for('add_person') }}">
  <input name="name" placeholder="Person Name" required>
  <button type="submit">Add</button>
</form>
<h3>All People</h3>
<ul>
  {% for p in persons %}
    <li>{{ p.name }}</li>
  {% endfor %}
</ul>
<a href="{{ url_for('logout') }}">Logout</a>
{% endblock %}
